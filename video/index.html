<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartaX — vídeo de 1 minuto</title>
<meta property="og:title" content="CartaX — aprender a conduzir, 10 minutos por dia">
<meta property="og:description" content="Vídeo de 1 minuto da app CartaX, um projeto Skyxlee.">
<meta property="og:image" content="https://cartax.skyxlee.com/video/capa.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{--bg:#1C1F26;--fg:#F5F3EE;--muted:#C9CED8;--acc:#F2B632;--blue:#1E63C4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Atkinson Hyperlegible',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;gap:20px}
  .logo{font-family:'Barlow Condensed',Arial,sans-serif;font-size:40px;font-weight:700;letter-spacing:.5px}
  .logo span{background:var(--blue);padding:0 10px;border-radius:8px;margin-right:2px}
  video{width:100%;max-width:380px;aspect-ratio:9/16;border-radius:24px;border:3px solid #3A3F4B;background:#000}
  p{margin:0;max-width:380px;text-align:center;color:var(--muted);line-height:1.5}
  a.btn{display:inline-block;background:var(--acc);color:var(--bg);font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px}
  small{color:#9AA1AE}
</style>
</head>
<body>
  <div class="logo"><span>Carta</span>X</div>
  <video src="cartax-1min.mp4" poster="capa.jpg" controls playsinline preload="metadata"></video>
  <p>Aprender a conduzir, 10 minutos por dia: lições curtas, simulador e perceção de perigo, ligados às escolas de condução.</p>
  <a class="btn" href="https://cartax.skyxlee.com/">Experimentar o protótipo</a>
  <small>Um projeto Skyxlee</small>
</body>
</html>
