<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartaX · Revisão de perguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --bg:#F5F3EE; --paper:#FFFFFF; --ink:#1C1F26; --soft:#4A5160; --line:#E2DFD6;
    --blue:#1E63C4; --blue-bg:#E7F0FB; --ok:#1F7A4D; --ok-bg:#E3F3EA; --warn:#8A5A00; --warn-bg:#FBF0D9; --dark:#1C1F26;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-size:17px;line-height:1.5}
  .top{background:var(--dark);color:#F5F3EE;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:5}
  .top-in{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
  .logo{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:26px;display:flex;align-items:center;gap:6px;color:#F5F3EE;text-decoration:none}
  .logo span{background:var(--blue);padding:0 8px;border-radius:6px}
  .logo small{font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-weight:400;font-size:15px;color:#C9CED8;margin-left:8px}
  .nav{display:flex;gap:8px;align-items:center;flex:1 1 280px;justify-content:flex-end}
  .nav select{flex:1 1 0;width:0;min-width:0;max-width:340px;font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid #3A3F4B;background:#262A33;color:#F5F3EE}
  .nav button{font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid #3A3F4B;background:#262A33;color:#F5F3EE;cursor:pointer}
  .nav button:disabled{opacity:.4;cursor:default}
  main{max-width:960px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0}
  h1{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
  h2{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:22px;margin:0 0 10px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
  .opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .opts li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
  .opts li.certa{border-color:var(--ok);background:var(--ok-bg)}
  .letra{font-weight:700;color:var(--soft);min-width:1.2em}
  .opts li{flex-wrap:wrap}
  .opts .txt{flex:1 1 200px;min-width:0}
  .ajuda{margin-top:8px;padding:8px 12px;border-left:3px solid var(--blue);background:var(--blue-bg);border-radius:0 8px 8px 0;font-size:15px}
  .ajuda b{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
  .exemplo{border-left:4px solid var(--blue)}
  .exemplo .btn-fake{display:inline-block;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--soft);margin-bottom:8px}
  .pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:var(--ok);color:#fff}
  .pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #E8CF97}
  .pill.info{background:var(--blue-bg);color:var(--blue)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:720px){.grid2{grid-template-columns:1fr}}
  .muted{color:var(--soft)}
  .cena-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:720px){.cena-main{grid-template-columns:1fr}}
  .big{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#ddd;aspect-ratio:1/1}
  .big svg{display:block;width:100%;height:100%}
  .cap{font-size:14px;color:var(--soft);margin:6px 0 0}
  .crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .crit li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--ok-bg)}
  .crit li.rev{background:var(--warn-bg)}
  .crit .ico{font-weight:700;color:var(--ok);min-width:1.2em}
  .crit li.rev .ico{color:var(--warn)}
  .crit .msg{display:block;font-size:14px;color:var(--warn)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .thumbs button{padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#ddd;cursor:pointer;aspect-ratio:1/1;position:relative}
  .thumbs button svg{display:block;width:100%;height:100%}
  .thumbs button[aria-pressed="true"]{border-color:var(--blue)}
  .thumbs button span{position:absolute;left:4px;top:4px;background:rgba(28,31,38,.75);color:#fff;font-size:12px;border-radius:4px;padding:0 5px}
  .thumbs button:focus-visible,.nav button:focus-visible,.nav select:focus-visible{outline:3px solid #F2B632;outline-offset:2px}
  .check{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
  .todo{background:var(--dark);color:#F5F3EE;border:none}
  .todo h2{color:#F2B632}
  .todo .muted{color:#C9CED8}
  .lista{display:flex;flex-direction:column;gap:18px}
  .lista h2{margin-bottom:6px}
  .lista a{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:inherit;text-decoration:none;align-items:baseline}
  .lista a:hover{border-color:var(--blue)}
  .lista a b{color:var(--blue);min-width:2.2em}
  .lista .items{display:flex;flex-direction:column;gap:8px}
  footer{font-size:14px;color:var(--soft);text-align:center;padding:0 16px 32px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="ficha.html"><span>Carta</span>X<small>Revisão de perguntas</small></a>
    <div class="nav" id="nav" hidden>
      <button id="prev" aria-label="Pergunta anterior">‹</button>
      <select id="sel" aria-label="Escolher pergunta"></select>
      <button id="next" aria-label="Pergunta seguinte">›</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer>Banco de perguntas v0.1 · rascunho para revisão por instrutores · cartax.skyxlee.com</footer>

<script src="desenhador.js"></script>
<script src="banco.js"></script>
<script src="explicacoes.js"></script>
<script>
(function () {
  var C = window.CartaXCenas, B = window.CartaXBanco, E = window.CartaXExplicacoes || {};
  var L = Array.isArray(B) ? B : (B.perguntas || []);
  var AMB = { dia: "Dia", fim_tarde: "Fim de tarde", nublado: "Nublado", piso_molhado: "Piso molhado" };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  var POSN = { ao_lado: "ao teu lado", angulo_morto: "no teu ângulo morto", a_frente: "à tua frente", atras: "atrás de ti" };
  var TIPO = { ligeiro: "ligeiro", pesado: "pesado", ambulancia: "ambulância", bombeiros: "bombeiros", trator: "trator", bicicleta: "ciclista", peao: "peão" };
  function situacao(cs) {
    var tu = cs.filter(function (e) { return e.tu; })[0];
    return cs.filter(function (e) { return !e.tu; }).map(function (e) {
      if (e.junto_a && POSN[e.posicao || "ao_lado"]) return TIPO[e.tipo] + " " + POSN[e.posicao || "ao_lado"];
      if (!tu) return TIPO[e.tipo];
      var a = tu.rumo * Math.PI / 180, dx = e.x - tu.x, dy = e.y - tu.y, lado = dx * Math.cos(a) + dy * Math.sin(a);
      return TIPO[e.tipo] + (lado < -60 ? " a vir da tua esquerda" : lado > 60 ? " a vir da tua direita" : "");
    }).join(", ");
  }
  function ids(svg, n) { return svg.replace(/brilhoAzul/g, "brilhoAzul" + n); }

  function lista() {
    $("nav").hidden = true;
    var temas = [];
    L.forEach(function (q) { var t = temas.find(function (x) { return x.nome === q.tema; }); if (!t) temas.push(t = { nome: q.tema, qs: [] }); t.qs.push(q); });
    var h = '<div><p class="eyebrow">Banco de perguntas v0.1</p><h1>Perguntas para rever</h1><p class="muted">' + L.length + ' perguntas com cena. Escolhe uma para ver a pergunta, as respostas com as ajudas do tutor, a explicação e as 20 cenas.</p></div><div class="lista">';
    temas.forEach(function (t) {
      h += '<section><h2>' + esc(t.nome) + '</h2><div class="items">';
      t.qs.forEach(function (q) { h += '<a href="?q=' + encodeURIComponent(q.id) + '"><b>' + esc(q.id) + '</b><span>' + esc(q.enunciado) + '</span></a>'; });
      h += '</div></section>';
    });
    $("main").innerHTML = h + '</div>';
  }

  function ficha(i) {
    var q = L[i], ex = E[q.id] || {}, sel = 1;
    $("nav").hidden = false; $("sel").value = q.id;
    $("prev").disabled = i === 0; $("next").disabled = i === L.length - 1;
    document.title = "CartaX · Pergunta " + q.id;

    var art = ex.artigo || "A confirmar";
    var artPill = /confirmar/i.test(art) ? '<span class="pill warn">A confirmar pelo instrutor</span>' : (/boa prática/i.test(art) ? '<span class="pill info">Boa prática</span>' : '');

    var h = '<div><p class="eyebrow">Pergunta ' + esc(q.id) + ' · ' + esc(q.tema) + '</p><h1>' + esc(q.enunciado) + '</h1></div>';
    var erradas = ex.erradas || {};
    h += '<section class="card"><h2>Respostas e ajudas do tutor</h2><p class="cap" style="margin:-4px 0 12px">Por baixo de cada resposta errada está o que a app mostra a quem a escolher. Versão para escolas, com os termos do Código da Estrada.</p><ul class="opts">';
    q.opcoes.forEach(function (o, k) {
      var ajuda = o[1] ? '' : '<div class="ajuda"><b>Se o aluno escolher esta</b>' + esc(erradas[k] || "Por escrever.") + '</div>';
      h += '<li class="' + (o[1] ? "certa" : "") + '"><span class="letra">' + "ABCDE"[k] + '</span><div class="txt">' + esc(o[0]) + ajuda + '</div>' + (o[1] ? '<span class="pill ok">✓ Resposta certa</span>' : '') + '</li>';
    });
    h += '</ul></section>';
    h += '<div class="grid2"><section class="card"><h2>Explicação</h2><p style="margin:0">' + esc(ex.explicacao || "Por escrever.") + '</p></section>';
    h += '<section class="card"><h2>Artigo do Código da Estrada</h2><p style="margin:0 0 8px">' + esc(art) + '</p>' + artPill + '</section></div>';
    h += '<section class="card exemplo"><h2>Exemplo</h2><span class="btn-fake">Dá-me um exemplo</span><p style="margin:0">' + esc(ex.exemplo || "Por escrever.") + '</p><p class="cap">Aparece quando o aluno, depois de errar, carrega neste botão.</p></section>';

    var v = C.verificar(q.cena);
    h += '<section class="card"><h2>Cena</h2><div class="cena-main"><div><div class="big" id="big"></div><p class="cap" id="cap"></p></div><div><h2 style="font-size:19px">O que tem de aparecer</h2><ul class="crit">';
    (v.criticos || []).forEach(function (c) {
      h += '<li class="' + (c.ok ? "" : "rev") + '"><span class="ico">' + (c.ok ? "✓" : "!") + '</span><span>' + esc(c.texto) + (c.ok ? "" : '<span class="msg">Rever: ' + esc(c.mensagens.join(" ")) + '</span>') + '</span></li>';
    });
    h += '</ul><p class="cap">✓ = a app confirmou que está no desenho. O instrutor confirma com os próprios olhos.</p></div></div>';
    h += '<h2 style="font-size:19px;margin-top:18px">As 20 variantes que o aluno pode ver</h2><p class="cap" style="margin:-6px 0 10px">' + (v.variacoes ? 'Nesta pergunta muda também a posição ou o sentido dos outros veículos, só dentro do que a regra permite: a resposta certa é a mesma em todas.' : 'Mudam as cores, a hora do dia e o piso. A estrada e a regra são sempre as mesmas.') + '</p><div class="thumbs" id="thumbs"></div></section>';

    h += '<section class="card todo"><h2>O que o instrutor confirma</h2><ol class="check"><li>A pergunta está clara e correta.</li><li>Só uma resposta está certa, e é a assinalada.</li><li>A explicação, a ajuda de cada resposta errada e o exemplo estão certos e usam os termos do Código.</li><li>O artigo é o certo (ou indica-o, se estiver «a confirmar»).</li><li>As cenas mostram a situação e tudo o que tem de aparecer.</li></ol><p class="muted" style="margin:12px 0 0">Na folha de revisão: marcar <b style="color:#F5F3EE">OK</b> ou <b style="color:#F5F3EE">Corrigir</b>, com um comentário.</p></section>';
    $("main").innerHTML = h;

    function mostrar(s) {
      sel = s;
      var r = C.desenhar(q.cena, { semente: s });
      $("big").innerHTML = ids(r.svg, "g");
      $("cap").textContent = "Variante " + s + " de 20 · " + (AMB[r.ambiente] || r.ambiente || "") + (v.variacoes ? " · " + situacao(r.colocados) : "");
      Array.prototype.forEach.call($("thumbs").children, function (b, k) { b.setAttribute("aria-pressed", String(k + 1 === s)); });
    }
    var th = $("thumbs");
    for (var s = 1; s <= 20; s++) {
      (function (s) {
        var r = C.desenhar(q.cena, { semente: s });
        var b = document.createElement("button");
        b.type = "button"; b.setAttribute("aria-label", "Ver variante " + s);
        b.innerHTML = ids(r.svg, s) + "<span>" + s + "</span>";
        b.onclick = function () { mostrar(s); $("big").scrollIntoView({ behavior: "smooth", block: "nearest" }); };
        th.appendChild(b);
      })(s);
    }
    mostrar(1);
  }

  function abrir() {
    var id = new URLSearchParams(location.search).get("q");
    var i = L.findIndex(function (q) { return q.id === id; });
    window.scrollTo(0, 0);
    if (i < 0) lista(); else ficha(i);
  }
  function ir(i) { history.pushState(null, "", "?q=" + encodeURIComponent(L[i].id)); abrir(); }

  $("sel").innerHTML = L.map(function (q) { return '<option value="' + esc(q.id) + '">' + esc(q.id + " · " + q.enunciado.slice(0, 48) + (q.enunciado.length > 48 ? "…" : "")) + '</option>'; }).join("");
  $("sel").onchange = function () { ir(L.findIndex(function (q) { return q.id === $("sel").value; })); };
  $("prev").onclick = function () { var i = L.findIndex(function (q) { return q.id === $("sel").value; }); if (i > 0) ir(i - 1); };
  $("next").onclick = function () { var i = L.findIndex(function (q) { return q.id === $("sel").value; }); if (i < L.length - 1) ir(i + 1); };
  window.addEventListener("popstate", abrir);
  abrir();
})();
</script>
</body>
</html>
